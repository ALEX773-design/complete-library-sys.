<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Lists</title>
    <script src="{{ url_for('static', filename='nightmode.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='nav.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='lists.css') }}">
</head>
<body>

    {% include "header.html" %}

    <main>
        <section class="lists-page">
            <h1>My Lists</h1>

            <form class="new-list-form" id="newListForm">
                <input type="text" id="newListInput" placeholder="Name a new list...">
                <button type="submit">Create</button>
            </form>

            <div id="listsContainer"></div>
        </section>
    </main>

    <script src="{{ url_for('static', filename='nav.js') }}"></script>
    <script src="{{ url_for('static', filename='lists.js') }}"></script>
    <script src="{{ url_for('static', filename='listspage.js') }}"></script>
    {% include "footer.html" %}
</body>
</html>
