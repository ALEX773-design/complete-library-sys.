<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse</title>
    <script src="{{ url_for('static', filename='nightmode.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='nav.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='browse.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='lists.css') }}">
</head>
<body>

    {% include "header.html" %}

    <main>
        <section class="browse">
            <h1>Browse</h1>

            <div class="browse-tabs">
                <button class="browse-tab active" data-category="all">All</button>
                <button class="browse-tab" data-category="recent">Recent</button>
                <button class="browse-tab" data-category="popular">Popular</button>
            </div>

            <div class="browse-books" id="browseBooks"></div>
        </section>
    </main>

    <script src="{{ url_for('static', filename='nav.js') }}"></script>
    <script src="{{ url_for('static', filename='lists.js') }}"></script>
    <script src="{{ url_for('static', filename='favorites.js') }}"></script>
    <script src="{{ url_for('static', filename='browse.js') }}"></script>
    {% include "footer.html" %}
</body>
</html>
