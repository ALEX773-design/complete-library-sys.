<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users</title>
    <script src="{{ url_for('static', filename='nightmode.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='nav.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='pages.css') }}">
</head>
<body>

    {% include "header.html" %}

    <main>
        <section class="page-content">
            <div class="admin-banner">⚠ Admin only ⚠</div>
            <h1>Users</h1>

            <div class="admin-tabs">
                <button class="admin-tab active" data-panel="usersPanel">Users</button>
                <button class="admin-tab" data-panel="allProfilesPanel">All Profiles</button>
                <button class="admin-tab" data-panel="addBookPanel">Add Book</button>
                <button class="admin-tab" data-panel="notifyPanel">Notify</button>
                <button class="admin-tab" data-panel="devPanel">Dev</button>
            </div>

            <div class="admin-panel-section active" id="usersPanel">
                <div id="usersContainer"></div>
            </div>

            <div class="admin-panel-section" id="allProfilesPanel">
                <div id="allProfilesContainer"></div>
            </div>

            <div class="admin-panel-section" id="addBookPanel">
                <form id="addBookForm" class="dev-panel">
                    <div class="dev-row dev-row-stack">
                        Title
                        <input type="text" id="bookTitleInput" class="dev-input" placeholder="Book title" required>
                    </div>
                    <div class="dev-row dev-row-stack">
                        Author
                        <input type="text" id="bookAuthorInput" class="dev-input" placeholder="Author name">
                    </div>
                    <div class="dev-row dev-row-stack">
                        Year
                        <input type="number" id="bookYearInput" class="dev-input" placeholder="Publication year">
                    </div>
                    <div class="dev-row dev-row-stack">
                        Popularity (optional)
                        <input type="number" id="bookPopularityInput" class="dev-input" placeholder="0">
                    </div>
                    <div class="dev-row dev-row-stack">
                        Cover image URL
                        <input type="text" id="bookCoverInput" class="dev-input" placeholder="static/images/covers/example.jpg">
                    </div>
                    <div class="dev-row dev-row-stack">
                        Genres
                        <div class="genre-checkboxes" id="genreCheckboxes"></div>
                    </div>
                    <button type="submit" class="dev-btn">Add Book</button>
                    <p id="addBookMessage" class="lists-empty" style="display:none;"></p>
                </form>
            </div>

            <div class="admin-panel-section" id="notifyPanel">
                <form id="sendNotificationForm" class="dev-panel">
                    <div class="dev-row dev-row-stack">
                        Message
                        <textarea id="notificationMessageInput" class="dev-textarea" placeholder="What should they see?" required></textarea>
                    </div>
                    <div class="dev-row">
                        <label><input type="radio" name="notifyTarget" value="all" checked> Everyone</label>
                        <label><input type="radio" name="notifyTarget" value="specific"> Specific users</label>
                    </div>
                    <div class="dev-row dev-row-stack" id="notifyUserListRow" style="display:none;">
                        Select users
                        <div id="notifyUserCheckboxes" class="genre-checkboxes"></div>
                    </div>
                    <button type="submit" class="dev-btn">Send</button>
                    <p id="sendNotificationMessage" class="lists-empty" style="display:none;"></p>
                </form>
            </div>

            <div class="admin-panel-section" id="devPanel">
                <div class="dev-panel">
                    <div class="dev-row">
                        Maintenance mode
                        <button class="dev-btn" id="maintenanceToggleBtn">Off</button>
                    </div>
                    <div class="dev-row dev-row-stack">
                        Custom CSS
                        <textarea id="customCssInput" class="dev-textarea" placeholder="/* site-wide CSS, applies to every page */"></textarea>
                        <button class="dev-btn" id="saveCssBtn">Save CSS</button>
                    </div>
                    <div class="dev-row dev-row-stack">
                        Footer text
                        <textarea id="footerTextInput" class="dev-textarea" placeholder="Text shown in the footer on every page"></textarea>
                        <button class="dev-btn" id="saveFooterBtn">Save Footer</button>
                    </div>
                    <div class="dev-row">
                        Download data
                        <button class="dev-btn" id="downloadDataBtn">Export</button>
                    </div>
                    <div class="dev-row danger dev-row-stack">
                        Delete all (non-admin accounts + their data)
                        <input type="text" id="deleteConfirmInput" class="dev-input" placeholder="Type DELETE to confirm">
                        <button class="dev-btn" id="deleteAllBtn">Delete</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="{{ url_for('static', filename='nav.js') }}"></script>
    <script src="{{ url_for('static', filename='userspage.js') }}"></script>
    {% include "footer.html" %}
</body>
</html>
