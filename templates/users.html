<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users</title>
    <script src="{{ url_for('static', filename='nightmode.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='nav.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='pages.css') }}">
</head>
<body>

    <header class="navbar">
        <div class="menu-box" id="menuBox">
            <button class="menu-button" id="menuButton">☰</button>
            <div class="menu-content">
                <a href="search.html">Search</a>
                <a href="browse.html">Browse All</a>
                <a href="lists.html">Lists</a>
                <a href="account.html">Account</a>
            </div>
        </div>

        <a href="homepage.html" class="logo">
            National Library
            <img class="logo-decoration" src="{{ url_for('static', filename='images/logo-decoration.png') }}" alt="">
        </a>

        <div class="account-box" id="accountBox">
            <button class="account-button" id="accountButton">◉</button>
            <div class="account-content">
                <a href="profile.html">Profile</a>
                <a href="borrowed-books.html">Borrowed Books</a>
                <a href="borrowing-history.html">Borrowing History</a>
                <a href="reading-history.html">Reading History</a>
                <a href="favorites.html">Favorites</a>
                <a href="ecard.html">Library E-card</a>
            </div>
        </div>
    </header>

    <main>
        <section class="page-content">
            <div class="admin-banner">⚠ Admin only ⚠</div>
            <h1>Users</h1>

            <div class="admin-tabs">
                <button class="admin-tab active" data-panel="usersPanel">Users</button>
                <button class="admin-tab" data-panel="allProfilesPanel">All Profiles</button>
                <button class="admin-tab" data-panel="devPanel">Dev</button>
            </div>

            <div class="admin-panel-section active" id="usersPanel">
                <div id="usersContainer"></div>
            </div>

            <div class="admin-panel-section" id="allProfilesPanel">
                <div id="allProfilesContainer"></div>
            </div>

            <div class="admin-panel-section" id="devPanel">
                <div class="dev-panel">
                    <div class="dev-row">
                        Maintenance mode
                        <button class="dev-btn" id="maintenanceToggleBtn">Off</button>
                    </div>
                    <div class="dev-row dev-row-stack">
                        Custom CSS
                        <textarea id="customCssInput" class="dev-textarea" placeholder="/* site-wide CSS, applies to every page */"></textarea>
                        <button class="dev-btn" id="saveCssBtn">Save CSS</button>
                    </div>
                    <div class="dev-row dev-row-stack">
                        Footer text
                        <textarea id="footerTextInput" class="dev-textarea" placeholder="Text shown in the footer on every page"></textarea>
                        <button class="dev-btn" id="saveFooterBtn">Save Footer</button>
                    </div>
                    <div class="dev-row">
                        Download data
                        <button class="dev-btn" id="downloadDataBtn">Export</button>
                    </div>
                    <div class="dev-row danger dev-row-stack">
                        Delete all (non-admin accounts + their data)
                        <input type="text" id="deleteConfirmInput" class="dev-input" placeholder="Type DELETE to confirm">
                        <button class="dev-btn" id="deleteAllBtn">Delete</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="{{ url_for('static', filename='nav.js') }}"></script>
    <script src="{{ url_for('static', filename='userspage.js') }}"></script>
    {% include "footer.html" %}
</body>
</html>
