<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Library E-card</title>

    <script src="{{ url_for('static', filename='nightmode.js') }}"></script>

    <link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='nav.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='ecard.css') }}">
</head>

<body>

    {% include "header.html" %}


    <main>

        <section class="ecard-page">

            <h3>Library E-card</h3>

            <p class="ecard-subtitle">
                Your official National Library membership card
            </p>


            <div class="library-card">


                <!-- TOP -->

                <div class="card-top">

                    <div class="card-logo">

                        NL

                    </div>


                    <div class="card-library-name">

                        <h2>
                            National Library
                        </h2>

                        <span>
                            MEMBERSHIP CARD
                        </span>

                    </div>

                </div>


                <!-- MIDDLE -->

                <div class="card-middle">


                    <div class="member-photo">

                        <div class="photo-placeholder">
                            ◉
                        </div>

                    </div>


                    <div class="member-information">


                        <div class="card-info">

                            <span class="info-label">
                                MEMBER NAME
                            </span>

                            <strong id="memberName">
                                Library Member
                            </strong>

                        </div>


                        <div class="card-info">

                            <span class="info-label">
                                MEMBER ID
                            </span>

                            <strong id="memberId">
                                NL-000001
                            </strong>

                        </div>


                        <div class="card-info">

                            <span class="info-label">
                                MEMBER SINCE
                            </span>

                            <strong id="memberSince">
                                2026
                            </strong>

                        </div>


                    </div>

                </div>


                <!-- BOTTOM -->

                <div class="card-bottom">

                    <span class="card-number" id="cardNumber">
                        NL • 2026 • 000001
                    </span>


                    <span class="card-status">
                        ACTIVE MEMBER
                    </span>

                </div>


            </div>

        </section>

    </main>


    <script src="{{ url_for('static', filename='nav.js') }}"></script>
    <script src="{{ url_for('static', filename='ecardscript.js') }}"></script>

    {% include "footer.html" %}
</body>
</html>
