<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account</title>
    <script src="{{ url_for('static', filename='nightmode.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='nav.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='pages.css') }}">
</head>
<body>

    <header class="navbar">
        <div class="menu-box" id="menuBox">
            <button class="menu-button" id="menuButton">☰</button>
            <div class="menu-content">
                <a href="search.html">Search</a>
                <a href="browse.html">Browse All</a>
                <a href="lists.html">Lists</a>
                <a href="account.html">Account</a>
            </div>
        </div>

        <a href="homepage.html" class="logo">
            National Library
            <img class="logo-decoration" src="{{ url_for('static', filename='images/logo-decoration.png') }}" alt="">
        </a>

        <div class="account-box" id="accountBox">
            <button class="account-button" id="accountButton">◉</button>
            <div class="account-content">
                <a href="profile.html">Profile</a>
                <a href="borrowed-books.html">Borrowed Books</a>
                <a href="borrowing-history.html">Borrowing History</a>
                <a href="reading-history.html">Reading History</a>
                <a href="favorites.html">Favorites</a>
                <a href="ecard.html">Library E-card</a>
                <a href="#" id="logoutLink">Log Out</a>
            </div>
        </div>
    </header>

    <main>
        <section class="page-content">
            <h1>Account</h1>

            <div class="page-links">
                <a href="profile.html">Profile</a>

                <div class="page-link-row">
                    Night Mode
                    <label class="switch">
                        <input type="checkbox" id="nightModeToggle">
                        <span class="switch-track"></span>
                    </label>
                </div>

                <a href="users.html" data-requires-admin class="admin-only-hidden">Users <span style="opacity:0.6; font-size:12px;">(admin)</span></a>
            </div>
        </section>
    </main>

    <script src="{{ url_for('static', filename='nav.js') }}"></script>
    <script>
        const nightModeToggle = document.getElementById("nightModeToggle");
        nightModeToggle.checked = isNightModeOn();
        nightModeToggle.addEventListener("change", () => setNightMode(nightModeToggle.checked));
    </script>
    {% include "footer.html" %}
</body>
</html>
